<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Roller / サイコロ・ダイスロールツール</title>
<meta name="description" content="2d6+3のようなダイス記法にも対応したサイコロツール。TRPG・ボードゲームに。">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4214020669195548"
     crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #14101c; --card: #1f1930; --text: #f4f1fa; --sub: #a99fc2;
    --accent: #a78bfa; --accent2: #34d399; --border: #322847;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .top-row { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  .lang-btn { background: none; border: 1px solid var(--border); color: var(--sub); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  h1 { font-size: 21px; text-align: center; margin: 4px 0 4px; }
  .lead { text-align: center; color: var(--sub); font-size: 13px; margin-bottom: 18px; line-height: 1.6; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .quick-dice { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .quick-dice button {
    flex: 1 1 27%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    background: #150f22; color: var(--text); font-size: 14px; cursor: pointer;
  }
  .quick-dice button.active { background: var(--accent); color: #1c0f3a; border-color: var(--accent); font-weight: bold; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  input[type="number"] { width: 100%; padding: 9px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; background: #150f22; color: var(--text); }
  .roll-btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: var(--accent); color: #1c0f3a; margin-top: 12px; }
  #resultCard { display: none; text-align: center; }
  .total-num { font-size: 42px; font-weight: bold; color: var(--accent2); margin: 6px 0 4px; }
  .breakdown { font-size: 13px; color: var(--sub); margin-bottom: 12px; }
  .history { text-align: left; font-size: 12px; color: var(--sub); max-height: 120px; overflow-y: auto; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  .history div { padding: 3px 0; }
  .copy-btn { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px; font-size: 13.5px; cursor: pointer; background: none; color: var(--text); margin-top: 6px; }
  .footer-links { text-align: center; font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.8; }
  .footer-links a { color: var(--accent2); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row"><button class="lang-btn" id="langBtn">EN</button></div>
  <h1 id="title">🎲 サイコロ・ダイスロールツール</h1>
  <p class="lead" id="lead">面数・個数・修正値を選んでロール。TRPG・ボードゲームに。</p>

  <div class="card">
    <div class="quick-dice" id="quickDice"></div>
    <div class="row">
      <div>
        <label id="countLabel">個数</label>
        <input type="number" id="diceCount" value="1" min="1" max="20">
      </div>
      <div>
        <label id="modLabel">修正値(+/-)</label>
        <input type="number" id="modifier" value="0">
      </div>
    </div>
    <button class="roll-btn" id="rollBtn"></button>
  </div>

  <div class="card" id="resultCard">
    <div class="total-num" id="totalNum">0</div>
    <div class="breakdown" id="breakdown"></div>
    <button class="copy-btn" id="copyBtn"></button>
    <div class="history" id="history"></div>
  </div>

  <p class="footer-links" id="footerLinks"></p>
</div>

<script>
  const DICE_TYPES = [4, 6, 8, 10, 12, 20, 100];
  const I18N = {
    ja: {
      title: '🎲 サイコロ・ダイスロールツール',
      lead: '面数・個数・修正値を選んでロール。TRPG・ボードゲームに。',
      countLabel: '個数',
      modLabel: '修正値(+/-)',
      rollBtn: 'ロールする',
      breakdown: (sides, rolls, mod) => `d${sides} × ${rolls.length}: [${rolls.join(', ')}]` + (mod ? ` ${mod >= 0 ? '+' : ''}${mod}` : ''),
      copyBtn: '結果をコピー',
      copied: 'コピーしました!',
      shareText: (notation, total) => `${notation} をロール → 結果: ${total} 🎲`,
      footerLinks: '他のツールも作っています → <a href="https://naginata-work.github.io/fair-picker/" target="_blank" rel="noopener">公平くじ引き</a> / <a href="https://naginata-work.github.io/team-shuffler/" target="_blank" rel="noopener">チーム分け</a>'
    },
    en: {
      title: '🎲 Dice Roller',
      lead: 'Pick dice type, count, and a modifier, then roll. For tabletop games and board games.',
      countLabel: 'Count',
      modLabel: 'Modifier (+/-)',
      rollBtn: 'Roll',
      breakdown: (sides, rolls, mod) => `d${sides} × ${rolls.length}: [${rolls.join(', ')}]` + (mod ? ` ${mod >= 0 ? '+' : ''}${mod}` : ''),
      copyBtn: 'Copy result',
      copied: 'Copied!',
      shareText: (notation, total) => `Rolled ${notation} → Result: ${total} 🎲`,
      footerLinks: 'Also made these → <a href="https://naginata-work.github.io/fair-picker/" target="_blank" rel="noopener">Fair Picker</a> / <a href="https://naginata-work.github.io/team-shuffler/" target="_blank" rel="noopener">Team Shuffler</a>'
    }
  };

  function loadLang() { try { return localStorage.getItem('diceRollerLang'); } catch (e) { return null; } }
  function saveLang(l) { try { localStorage.setItem('diceRollerLang', l); } catch (e) {} }
  let lang = loadLang() === 'en' ? 'en' : 'ja';
  function t() { return I18N[lang]; }

  let sides = 6;
  let history = [];
  let lastResult = null;

  function renderQuickDice() {
    const container = document.getElementById('quickDice');
    container.innerHTML = '';
    DICE_TYPES.forEach(s => {
      const btn = document.createElement('button');
      btn.textContent = 'd' + s;
      if (s === sides) btn.classList.add('active');
      btn.addEventListener('click', () => {
        sides = s;
        renderQuickDice();
      });
      container.appendChild(btn);
    });
  }
  renderQuickDice();

  function roll() {
    const count = Math.max(1, Math.min(20, parseInt(document.getElementById('diceCount').value, 10) || 1));
    const mod = parseInt(document.getElementById('modifier').value, 10) || 0;
    const rolls = [];
    for (let i = 0; i < count; i++) {
      rolls.push(1 + Math.floor(Math.random() * sides));
    }
    const total = rolls.reduce((a, b) => a + b, 0) + mod;
    const notation = `${count}d${sides}${mod ? (mod >= 0 ? '+' + mod : mod) : ''}`;
    lastResult = { notation, total };

    document.getElementById('totalNum').textContent = total;
    document.getElementById('breakdown').textContent = t().breakdown(sides, rolls, mod);
    document.getElementById('resultCard').style.display = 'block';

    history.unshift(`${notation} = ${total}`);
    history = history.slice(0, 10);
    renderHistory();
  }

  function renderHistory() {
    document.getElementById('history').innerHTML = history.map(h => `<div>${h}</div>`).join('');
  }

  document.getElementById('rollBtn').addEventListener('click', roll);

  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!lastResult) return;
    const text = t().shareText(lastResult.notation, lastResult.total) + ' ' + location.href;
    try {
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = t().copied;
      setTimeout(() => { btn.textContent = original; }, 1500);
    } catch {
      alert(text);
    }
  });

  function renderStaticText() {
    document.getElementById('title').textContent = t().title;
    document.getElementById('lead').textContent = t().lead;
    document.getElementById('countLabel').textContent = t().countLabel;
    document.getElementById('modLabel').textContent = t().modLabel;
    document.getElementById('rollBtn').textContent = t().rollBtn;
    document.getElementById('copyBtn').textContent = t().copyBtn;
    document.getElementById('footerLinks').innerHTML = t().footerLinks;
    if (lastResult) {
      document.getElementById('breakdown').textContent = '';
    }
  }

  document.getElementById('langBtn').addEventListener('click', () => {
    lang = lang === 'ja' ? 'en' : 'ja';
    saveLang(lang);
    document.getElementById('langBtn').textContent = lang === 'ja' ? 'EN' : 'JA';
    renderStaticText();
  });

  document.getElementById('langBtn').textContent = lang === 'ja' ? 'EN' : 'JA';
  renderStaticText();
</script>
</body>
</html>
